<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>健康記録ノート</title>

  <style>

    :root {

      --primary-color: #2e7d32;

      --primary-light: #e8f5e9;

      --primary-hover: #1b5e20;

      --accent-color: #66bb6a;

      --bg-color: #f4f6f4;

      --card-bg: #ffffff;

      --text-main: #2c3e50;

      --text-sub: #607d8b;

      --border-color: #e0e6ed;

      --shadow-sm: 0 4px 12px rgba(46, 125, 50, 0.08);

      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);

    }



    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    }



    body {

      background-color: var(--bg-color);

      color: var(--text-main);

      line-height: 1.6;

      padding-bottom: 50px;

    }



    /* ヘッダー */

    header {

      background: linear-gradient(135deg, #2e7d32, #388e3c);

      color: #ffffff;

      padding: 18px 20px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      box-shadow: var(--shadow-sm);

      position: sticky;

      top: 0;

      z-index: 100;

    }



    header h1 {

      font-size: 1.25rem;

      font-weight: 700;

      letter-spacing: 0.5px;

      display: flex;

      align-items: center;

      gap: 8px;

    }



    .settings-btn {

      background: rgba(255, 255, 255, 0.2);

      border: none;

      color: white;

      font-size: 1.2rem;

      cursor: pointer;

      width: 38px;

      height: 38px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: background 0.2s;

    }



    .settings-btn:hover {

      background: rgba(255, 255, 255, 0.3);

    }



    /* コンテナ */

    .container {

      max-width: 650px;

      margin: 0 auto;

      padding: 20px 16px;

    }



    /* カードデザイン */

    .card {

      background-color: var(--card-bg);

      border-radius: 16px;

      padding: 24px;

      margin-bottom: 24px;

      box-shadow: var(--shadow-md);

      border: 1px solid rgba(224, 230, 237, 0.6);

    }



    .card-title {

      font-size: 1.15rem;

      font-weight: 700;

      margin-bottom: 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      color: var(--primary-color);

      border-bottom: 2px solid var(--primary-light);

      padding-bottom: 8px;

    }



    .card-title-text {

      display: flex;

      align-items: center;

      gap: 10px;

    }



    /* フォーム */

    .form-group {

      margin-bottom: 18px;

    }



    .form-group label {

      display: block;

      font-size: 0.88rem;

      font-weight: 600;

      margin-bottom: 6px;

      color: var(--text-sub);

    }



    .form-control {

      width: 100%;

      padding: 12px 14px;

      font-size: 1rem;

      border: 1.5px solid var(--border-color);

      border-radius: 10px;

      outline: none;

      background-color: #fafcfb;

      transition: all 0.2s ease;

    }



    .form-control:focus {

      border-color: var(--accent-color);

      background-color: #ffffff;

      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);

    }



    .input-row-3 {

      display: grid;

      grid-template-columns: 1fr 1fr 1fr;

      gap: 10px;

    }



    .input-row-2 {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

    }



    .btn {

      display: block;

      width: 100%;

      padding: 14px;

      background: linear-gradient(135deg, #4caf50, #2e7d32);

      color: white;

      border: none;

      border-radius: 12px;

      font-size: 1.1rem;

      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);

      transition: all 0.2s ease;

      margin-top: 8px;

    }



    .btn:hover {

      background: linear-gradient(135deg, #43a047, #1b5e20);

      transform: translateY(-1px);

    }



    /* 音声入力ボタン関連 */

    .voice-btn-container {

      display: flex;

      flex-direction: column;

      align-items: flex-end;

      gap: 2px;

    }



    .voice-all-btn {

      background: #e8f5e9;

      color: #2e7d32;

      border: 1px solid #a5d6a7;

      padding: 6px 12px;

      border-radius: 20px;

      font-size: 0.85rem;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 4px;

      transition: all 0.2s;

      user-select: none;

      -webkit-user-select: none;

    }



    .voice-all-btn:hover {

      background: #c8e6c9;

    }



    .voice-all-btn.recording {

      background-color: #ffebee;

      color: #e53935;

      border-color: #ef9a9a;

      animation: pulse 1.2s infinite;

    }



    .voice-note {

      font-size: 0.72rem;

      color: var(--text-sub);

      font-weight: 500;

    }



    @keyframes pulse {

      0% { transform: scale(1); }

      50% { transform: scale(1.03); }

      100% { transform: scale(1); }

    }



    .voice-status {

      font-size: 0.8rem;

      color: #e53935;

      margin-top: 4px;

      display: none;

      font-weight: 600;

    }



    /* フィルターエリア */

    .filter-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 18px;

      flex-wrap: wrap;

      gap: 10px;

    }



    .select-group {

      display: flex;

      gap: 8px;

    }



    .select-control {

      padding: 8px 14px;

      font-size: 0.95rem;

      font-weight: 700;

      border-radius: 10px;

      border: 1.5px solid var(--border-color);

      background-color: #ffffff;

      color: var(--text-main);

      cursor: pointer;

      outline: none;

    }



    /* サマリー */

    .monthly-summary {

      background-color: var(--primary-light);

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 20px;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 12px;

      text-align: center;

    }



    .summary-item .label {

      font-size: 0.75rem;

      color: var(--text-sub);

      font-weight: 600;

      margin-bottom: 2px;

    }



    .summary-item .value {

      font-size: 1.05rem;

      font-weight: 700;

      color: var(--primary-color);

    }



    /* 月間カレンダー・日別集計テーブル */

    .monthly-table-wrapper {

      overflow-x: auto;

      margin-top: 10px;

    }



    .monthly-table {

      width: 100%;

      border-collapse: collapse;

      font-size: 0.88rem;

    }



    .monthly-table th, .monthly-table td {

      padding: 10px 8px;

      text-align: center;

      border-bottom: 1px solid var(--border-color);

    }



    .monthly-table th {

      background-color: #f8faf8;

      color: var(--text-sub);

      font-weight: 700;

      font-size: 0.8rem;

    }



    .monthly-table td.date-cell {

      font-weight: 700;

      color: var(--text-main);

      background-color: #fafcfb;

    }



    /* 記録リスト（最下部一覧） */

    .record-list {

      list-style: none;

    }



    .record-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 14px 12px;

      border-bottom: 1px solid var(--border-color);

      border-radius: 8px;

      transition: background 0.15s;

    }



    .record-item:hover {

      background-color: #f9fbf9;

    }



    .record-item:last-child {

      border-bottom: none;

    }



    .record-date {

      font-size: 0.82rem;

      color: var(--text-sub);

      font-weight: 600;

      margin-bottom: 3px;

    }



    .record-main-val {

      font-size: 1.1rem;

      font-weight: 700;

      color: var(--text-main);

    }



    .record-sub-val {

      font-size: 0.88rem;

      color: #546e7a;

      margin-top: 3px;

    }



    .record-unit {

      font-size: 0.8rem;

      font-weight: 400;

      color: #90a4ae;

    }



    .photo-badge {

      display: inline-block;

      background-color: #e8f5e9;

      color: #2e7d32;

      font-size: 0.75rem;

      font-weight: 600;

      padding: 2px 8px;

      border-radius: 12px;

      margin-left: 6px;

      cursor: pointer;

    }



    .delete-btn {

      background: none;

      border: none;

      color: #cfd8dc;

      cursor: pointer;

      font-size: 1.2rem;

      padding: 6px 10px;

      border-radius: 6px;

      transition: all 0.2s;

    }



    .delete-btn:hover {

      color: #e53935;

      background-color: #ffebee;

    }



    .empty-msg {

      text-align: center;

      color: var(--text-sub);

      padding: 24px 0;

      font-size: 0.95rem;

    }



    /* モーダル */

    .modal {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background-color: rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(2px);

      justify-content: center;

      align-items: center;

      z-index: 1000;

    }



    .modal-content {

      background-color: #fff;

      width: 90%;

      max-width: 440px;

      border-radius: 16px;

      padding: 24px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

    }



    .modal-header {

      font-size: 1.2rem;

      font-weight: 700;

      margin-bottom: 18px;

      color: var(--primary-color);

    }



    .modal-actions {

      display: flex;

      gap: 10px;

      margin-top: 24px;

    }



    .btn-secondary {

      background: #e0e0e0;

      color: #424242;

      box-shadow: none;

    }



    .img-preview {

      max-width: 100%;

      max-height: 300px;

      border-radius: 8px;

      margin-top: 10px;

      display: block;

    }

  </style>

</head>

<body>



  <!-- ヘッダー -->

  <header>

    <h1 id="appTitle">🌱 座間の母_血圧記録ノート</h1>

    <button class="settings-btn" id="openSettingsBtn" title="設定">⚙️</button>

  </header>



  <div class="container">

    <!-- 入力カード -->

    <div class="card">

      <div class="card-title">

        <div class="card-title-text">📝 今日の記録を入力</div>

        <div class="voice-btn-container">

          <button type="button" class="voice-all-btn" id="voiceAllBtn" title="押している間録音">

            🎤 まとめ音声入力

          </button>

          <span class="voice-note">※押している間録音</span>

        </div>

      </div>



      <div id="voiceStatus" class="voice-status">🎙️ 話している間ボタンを押し続けてください...</div>



      <form id="bpForm">

        <div class="form-group">

          <label for="recordDate">日時</label>

          <input type="datetime-local" id="recordDate" class="form-control" required>

        </div>



        <!-- 血圧・脈拍 -->

        <div class="input-row-3 form-group">

          <div>

            <label for="sys">最高(上)</label>

            <input type="number" id="sys" class="form-control" placeholder="120" required>

          </div>

          <div>

            <label for="dia">最低(下)</label>

            <input type="number" id="dia" class="form-control" placeholder="80" required>

          </div>

          <div>

            <label for="pulse">脈拍</label>

            <input type="number" id="pulse" class="form-control" placeholder="70" required>

          </div>

        </div>



        <!-- 体温・体重 -->

        <div class="input-row-2 form-group">

          <div>

            <label for="temp">🌡️ 体温 (℃)</label>

            <input type="number" step="0.1" id="temp" class="form-control" placeholder="36.5">

          </div>

          <div>

            <label for="weight">⚖️ 体重 (kg)</label>

            <input type="number" step="0.1" id="weight" class="form-control" placeholder="60.0">

          </div>

        </div>



        <!-- 過去データ用手書き写真追加 -->

        <div class="form-group">

          <label for="photoInput">📷 手書きノートの写真（任意）</label>

          <input type="file" id="photoInput" accept="image/*" class="form-control">

        </div>



        <button type="submit" class="btn">記録を保存する</button>

      </form>

    </div>



    <!-- 集計サマリー・1ヶ月分結果表示カード -->

    <div class="card">

      <div class="filter-header">

        <div class="card-title" style="margin-bottom:0; border-bottom:none; padding-bottom:0;">📊 月間集計・1ヶ月記録一覧</div>

        <div class="select-group">

          <select id="yearFilter" class="select-control"></select>

          <select id="monthFilter" class="select-control"></select>

        </div>

      </div>



      <!-- 月間平均値 -->

      <div class="monthly-summary" id="monthlySummary">

        <div class="summary-item">

          <div class="label">記録日数</div>

          <div class="value" id="summaryDays">0日</div>

        </div>

        <div class="summary-item">

          <div class="label">月平均血圧</div>

          <div class="value" id="summaryBp">- / -</div>

        </div>

        <div class="summary-item">

          <div class="label">月平均脈拍</div>

          <div class="value" id="summaryPulse">-</div>

        </div>

        <div class="summary-item">

          <div class="label">平均体温</div>

          <div class="value" id="summaryTemp">- ℃</div>

        </div>

        <div class="summary-item" style="grid-column: span 2;">

          <div class="label">平均体重</div>

          <div class="value" id="summaryWeight">- kg</div>

        </div>

      </div>



      <!-- 選択した月の1ヶ月分日別集計テーブル -->

      <div class="monthly-table-wrapper">

        <table class="monthly-table">

          <thead>

            <tr>

              <th>日付</th>

              <th>朝 (血圧/脈)</th>

              <th>夜 (血圧/脈)</th>

              <th>体温</th>

              <th>体重</th>

            </tr>

          </thead>

          <tbody id="monthlyTableBody">

            <!-- JSで動的に挿入 -->

          </tbody>

        </table>

      </div>

    </div>



    <!-- アプリ最下部：全履歴（タイムライン順） -->

    <div class="card">

      <div class="card-title">📖 全記録タイムライン</div>

      <ul id="recordList" class="record-list">

        <!-- JSで挿入 -->

      </ul>

    </div>

  </div>



  <!-- 写真閲覧モーダル -->

  <div class="modal" id="imageModal">

    <div class="modal-content">

      <div class="modal-header">📷 手書きノート写真</div>

      <img id="modalImg" class="img-preview" src="" alt="手書きノート">

      <div class="modal-actions">

        <button class="btn" id="closeImageBtn">閉じる</button>

      </div>

    </div>

  </div>



  <!-- 設定モーダル -->

  <div class="modal" id="settingsModal">

    <div class="modal-content">

      <div class="modal-header">⚙️ アプリの設定</div>

      <div class="form-group">

        <label for="userNameInput">使用者名（ニックネーム）</label>

        <input type="text" id="userNameInput" class="form-control" placeholder="座間の母">

      </div>

      <div class="modal-actions">

        <button class="btn btn-secondary" id="closeSettingsBtn">キャンセル</button>

        <button class="btn" id="saveSettingsBtn">保存する</button>

      </div>

    </div>

  </div>



  <script>

    const STORAGE_KEY_RECORDS = 'bp_records_data';

    const STORAGE_KEY_USER = 'bp_user_name';

    const DEFAULT_USER_NAME = '座間の母';



    // 初期サンプル過去データ

    const initialDefaultData = [

      { id: 1723680000000, date: '2026-08-15T08:00', sys: 132, dia: 85, pulse: 71, temp: 36.4, weight: 58.5, photo: null },

      { id: 1723716000000, date: '2026-08-15T20:00', sys: 128, dia: 80, pulse: 68, temp: null, weight: null, photo: null },

      { id: 1723766400000, date: '2026-08-16T08:00', sys: 135, dia: 88, pulse: 74, temp: 36.6, weight: 58.7, photo: null },

      { id: 1723802400000, date: '2026-08-16T20:00', sys: 130, dia: 82, pulse: 70, temp: null, weight: null, photo: null }

    ];



    let records = JSON.parse(localStorage.getItem(STORAGE_KEY_RECORDS)) || initialDefaultData;

    let userName = localStorage.getItem(STORAGE_KEY_USER) || DEFAULT_USER_NAME;



    const appTitle = document.getElementById('appTitle');

    const bpForm = document.getElementById('bpForm');

    const recordDateInput = document.getElementById('recordDate');

    const photoInput = document.getElementById('photoInput');

    const yearFilter = document.getElementById('yearFilter');

    const monthFilter = document.getElementById('monthFilter');

    const recordList = document.getElementById('recordList');

    const monthlyTableBody = document.getElementById('monthlyTableBody');

    

    const summaryDays = document.getElementById('summaryDays');

    const summaryBp = document.getElementById('summaryBp');

    const summaryPulse = document.getElementById('summaryPulse');

    const summaryTemp = document.getElementById('summaryTemp');

    const summaryWeight = document.getElementById('summaryWeight');



    const imageModal = document.getElementById('imageModal');

    const modalImg = document.getElementById('modalImg');

    const closeImageBtn = document.getElementById('closeImageBtn');



    const settingsModal = document.getElementById('settingsModal');

    const openSettingsBtn = document.getElementById('openSettingsBtn');

    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    const saveSettingsBtn = document.getElementById('saveSettingsBtn');

    const userNameInput = document.getElementById('userNameInput');



    const voiceStatus = document.getElementById('voiceStatus');

    const voiceAllBtn = document.getElementById('voiceAllBtn');



    function init() {

      const now = new Date();

      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

      recordDateInput.value = now.toISOString().slice(0, 16);



      updateTitle();

      setupFilters();

      renderRecords();

    }



    function updateTitle() {

      appTitle.textContent = `🌱 ${userName}_血圧記録ノート`;

    }



    function getBase64(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = () => resolve(reader.result);

        reader.onerror = error => reject(error);

      });

    }



    bpForm.addEventListener('submit', async (e) => {

      e.preventDefault();

      

      let photoBase64 = null;

      if (photoInput.files && photoInput.files[0]) {

        try {

          photoBase64 = await getBase64(photoInput.files[0]);

        } catch (err) {

          console.error("画像ロードエラー:", err);

        }

      }



      const newRecord = {

        id: Date.now(),

        date: recordDateInput.value,

        sys: parseInt(document.getElementById('sys').value),

        dia: parseInt(document.getElementById('dia').value),

        pulse: parseInt(document.getElementById('pulse').value),

        temp: document.getElementById('temp').value ? parseFloat(document.getElementById('temp').value) : null,

        weight: document.getElementById('weight').value ? parseFloat(document.getElementById('weight').value) : null,

        photo: photoBase64

      };



      records.unshift(newRecord);

      saveRecords();



      document.getElementById('sys').value = '';

      document.getElementById('dia').value = '';

      document.getElementById('pulse').value = '';

      document.getElementById('temp').value = '';

      document.getElementById('weight').value = '';

      photoInput.value = '';



      setupFilters();

      renderRecords();

    });



    function deleteRecord(id) {

      if (confirm('この記録を削除してもよろしいですか？')) {

        records = records.filter(r => r.id !== id);

        saveRecords();

        setupFilters();

        renderRecords();

      }

    }



    function viewPhoto(photoData) {

      modalImg.src = photoData;

      imageModal.style.display = 'flex';

    }



    closeImageBtn.addEventListener('click', () => {

      imageModal.style.display = 'none';

    });



    function saveRecords() {

      localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));

    }



    function setupFilters() {

      const now = new Date();

      const currentYear = now.getFullYear().toString();

      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');



      const yearsSet = new Set([currentYear]);

      records.forEach(r => {

        if (r.date) yearsSet.add(r.date.slice(0, 4));

      });



      const sortedYears = Array.from(yearsSet).sort().reverse();



      const prevSelectedYear = yearFilter.value;

      yearFilter.innerHTML = '';

      sortedYears.forEach(y => {

        const option = document.createElement('option');

        option.value = y;

        option.textContent = `${y}年`;

        yearFilter.appendChild(option);

      });

      yearFilter.value = (prevSelectedYear && sortedYears.includes(prevSelectedYear)) ? prevSelectedYear : currentYear;



      if (monthFilter.options.length === 0) {

        for (let m = 1; m <= 12; m++) {

          const mStr = String(m).padStart(2, '0');

          const option = document.createElement('option');

          option.value = mStr;

          option.textContent = `${m}月`;

          monthFilter.appendChild(option);

        }

        monthFilter.value = currentMonth;

      }

    }



    yearFilter.addEventListener('change', renderRecords);

    monthFilter.addEventListener('change', renderRecords);



    function renderRecords() {

      const selectedYear = parseInt(yearFilter.value);

      const selectedMonth = parseInt(monthFilter.value);

      const selectedYM = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;



      const filteredRecords = records.filter(r => r.date && r.date.startsWith(selectedYM));



      if (filteredRecords.length === 0) {

        summaryDays.textContent = '0日';

        summaryBp.textContent = '- / -';

        summaryPulse.textContent = '-';

        summaryTemp.textContent = '- ℃';

        summaryWeight.textContent = '- kg';

      } else {

        let totalSys = 0, totalDia = 0, totalPulse = 0;

        let totalTemp = 0, tempCount = 0;

        let totalWeight = 0, weightCount = 0;

        const uniqueDays = new Set();



        filteredRecords.forEach(r => {

          totalSys += r.sys;

          totalDia += r.dia;

          totalPulse += r.pulse;

          uniqueDays.add(r.date.slice(0, 10));



          if (r.temp) { totalTemp += r.temp; tempCount++; }

          if (r.weight) { totalWeight += r.weight; weightCount++; }

        });



        const count = filteredRecords.length;

        summaryDays.textContent = `${uniqueDays.size}日`;

        summaryBp.textContent = `${Math.round(totalSys / count)} / ${Math.round(totalDia / count)}`;

        summaryPulse.textContent = `${Math.round(totalPulse / count)}`;

        summaryTemp.textContent = tempCount > 0 ? `${(totalTemp / tempCount).toFixed(1)} ℃` : '- ℃';

        summaryWeight.textContent = weightCount > 0 ? `${(totalWeight / weightCount).toFixed(1)} kg` : '- kg';

      }



      monthlyTableBody.innerHTML = '';

      const daysInMonth = new Date(selectedYear, selectedMonth, 0).getDate();



      for (let day = 1; day <= daysInMonth; day++) {

        const dayStr = `${selectedYM}-${String(day).padStart(2, '0')}`;

        const dayRecords = filteredRecords.filter(r => r.date.startsWith(dayStr));



        let morningRec = null;

        let eveningRec = null;

        let temps = [];

        let weights = [];



        dayRecords.forEach(r => {

          const hour = new Date(r.date).getHours();

          if (hour < 12) {

            if (!morningRec) morningRec = r;

          } else {

            if (!eveningRec) eveningRec = r;

          }

          if (r.temp) temps.push(r.temp);

          if (r.weight) weights.push(r.weight);

        });



        if (dayRecords.length > 0) {

          const morningText = morningRec ? `${morningRec.sys}/${morningRec.dia} (${morningRec.pulse})` : '-';

          const eveningText = eveningRec ? `${eveningRec.sys}/${eveningRec.dia} (${eveningRec.pulse})` : '-';

          const tempText = temps.length > 0 ? `${temps[0].toFixed(1)}℃` : '-';

          const weightText = weights.length > 0 ? `${weights[0].toFixed(1)}kg` : '-';



          const tr = document.createElement('tr');

          tr.innerHTML = `

            <td class="date-cell">${selectedMonth}/${day}</td>

            <td>${morningText}</td>

            <td>${eveningText}</td>

            <td>${tempText}</td>

            <td>${weightText}</td>

          `;

          monthlyTableBody.appendChild(tr);

        }

      }



      if (monthlyTableBody.children.length === 0) {

        monthlyTableBody.innerHTML = `<tr><td colspan="5" style="color:var(--text-sub); padding:16px;">${selectedMonth}月の記録データはありません</td></tr>`;

      }



      recordList.innerHTML = '';

      if (records.length === 0) {

        recordList.innerHTML = '<div class="empty-msg">記録がありません</div>';

        return;

      }



      const sortedAll = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedAll.forEach(r => {

        const d = new Date(r.date);

        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;



        let subTextList = [];

        if (r.temp) subTextList.push(`体温: ${r.temp.toFixed(1)}℃`);

        if (r.weight) subTextList.push(`体重: ${r.weight.toFixed(1)}kg`);

        const subTextHtml = subTextList.length > 0 ? `<div class="record-sub-val">${subTextList.join(' / ')}</div>` : '';



        let photoBadgeHtml = '';

        if (r.photo) {

          photoBadgeHtml = `<span class="photo-badge" onclick="viewPhoto('${r.photo}')">📷 写真あり</span>`;

        }



        const li = document.createElement('li');

        li.className = 'record-item';

        li.innerHTML = `

          <div>

            <div class="record-date">${dateStr} ${photoBadgeHtml}</div>

            <div class="record-main-val">

              ${r.sys} / ${r.dia} <span class="record-unit">mmHg</span> &nbsp; ${r.pulse} <span class="record-unit">bpm</span>

            </div>

            ${subTextHtml}

          </div>

          <button class="delete-btn" onclick="deleteRecord(${r.id})" title="削除">✕</button>

        `;

        recordList.appendChild(li);

      });

    }



    openSettingsBtn.addEventListener('click', () => {

      userNameInput.value = userName;

      settingsModal.style.display = 'flex';

    });



    closeSettingsBtn.addEventListener('click', () => {

      settingsModal.style.display = 'none';

    });



    saveSettingsBtn.addEventListener('click', () => {

      const inputVal = userNameInput.value.trim();

      userName = inputVal || DEFAULT_USER_NAME;

      localStorage.setItem(STORAGE_KEY_USER, userName);

      updateTitle();

      settingsModal.style.display = 'none';

    });



    window.addEventListener('click', (e) => {

      if (e.target === settingsModal) settingsModal.style.display = 'none';

      if (e.target === imageModal) imageModal.style.display = 'none';

    });



    /* --- 改修版：長押し録音処理（マイク許可ポップアップ割り込み対策付き） --- */

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;

    let isRecording = false;

    let isMouseDown = false; // ボタンが押されているかどうかの状態を明示管理



    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = 'ja-JP';

      recognition.interimResults = false;

      recognition.continuous = true;



      recognition.onresult = (e) => {

        let fullTranscript = '';

        for (let i = 0; i < e.results.length; i++) {

          fullTranscript += e.results[i][0].transcript;

        }

        parseAndSetVoiceText(fullTranscript);

      };



      recognition.onerror = (e) => {

        console.error('Speech recognition error', e);

        stopVoiceRecording();

      };



      recognition.onend = () => {

        if (isRecording) {

          stopVoiceRecording();

        }

      };

    }



    function startVoiceRecording(e) {

      if (e) e.preventDefault();

      if (!SpeechRecognition) {

        alert('お使いのブラウザは音声入力に対応していません。');

        return;

      }

      

      isMouseDown = true;

      if (isRecording) return;



      isRecording = true;

      voiceAllBtn.classList.add('recording');

      voiceStatus.style.display = 'block';

      voiceStatus.textContent = '🎙️ 話している間ボタンを押し続けてください...';



      try {

        recognition.start();

      } catch (err) {

        console.error("録音開始エラー:", err);

      }

    }



    function stopVoiceRecording(e) {

      if (e) e.preventDefault();

      isMouseDown = false;



      // 録音中でなければ何もしない

      if (!isRecording) return;



      isRecording = false;

      voiceAllBtn.classList.remove('recording');

      voiceStatus.style.display = 'none';



      try {

        recognition.stop();

      } catch (err) {

        console.error("録音停止エラー:", err);

      }

    }



    // マウス・タッチ操作イベントの設定

    voiceAllBtn.addEventListener('mousedown', startVoiceRecording);

    voiceAllBtn.addEventListener('mouseup', stopVoiceRecording);

    

    // ダイアログが出た際にmouseleaveで強制終了しないよう除外

    voiceAllBtn.addEventListener('touchstart', startVoiceRecording);

    voiceAllBtn.addEventListener('touchend', stopVoiceRecording);



    // 画面外離脱時のケア

    window.addEventListener('mouseup', () => {

      if (isMouseDown) stopVoiceRecording();

    });



    function parseAndSetVoiceText(text) {

      let normalized = text

        .replace(/[０-９．]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0))

        .replace(/点|ドット/g, '.')

        .replace(/一/g, '1').replace(/二/g, '2').replace(/三/g, '3')

        .replace(/四/g, '4').replace(/五/g, '5').replace(/六/g, '6')

        .replace(/七/g, '7').replace(/八/g, '8').replace(/九/g, '9').replace(/〇|ゼロ/g, '0');



      const sysMatch = normalized.match(/(?:最高|上|うえ)[^\d.]*([\d.]+)/);

      const diaMatch = normalized.match(/(?:最低|下|した)[^\d.]*([\d.]+)/);

      const pulseMatch = normalized.match(/(?:脈拍|脈|みゃく)[^\d.]*([\d.]+)/);

      const tempMatch = normalized.match(/(?:体温|たいおん)[^\d.]*([\d.]+)/);

      const weightMatch = normalized.match(/(?:体重|たいじゅう)[^\d.]*([\d.]+)/);



      let updated = false;



      if (sysMatch) { document.getElementById('sys').value = sysMatch[1]; updated = true; }

      if (diaMatch) { document.getElementById('dia').value = diaMatch[1]; updated = true; }

      if (pulseMatch) { document.getElementById('pulse').value = pulseMatch[1]; updated = true; }

      if (tempMatch) { document.getElementById('temp').value = tempMatch[1]; updated = true; }

      if (weightMatch) { document.getElementById('weight').value = weightMatch[1]; updated = true; }



      if (!updated) {

        const nums = normalized.match(/[\d.]+/g);

        if (nums && nums.length > 0) {

          if (nums[0]) document.getElementById('sys').value = nums[0];

          if (nums[1]) document.getElementById('dia').value = nums[1];

          if (nums[2]) document.getElementById('pulse').value = nums[2];

          if (nums[3]) document.getElementById('temp').value = nums[3];

          if (nums[4]) document.getElementById('weight').value = nums[4];

        } else {

          alert(`「${text}」から数値を読み取れませんでした。`);

        }

      }

    }



    init();

  </script>
